set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'fabioluciano/tmux-powerkit'

# Reference: https://github.com/leonasdev/.dotfiles/issues/15
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ',*:Tc'
set -ga terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Better copy mode
unbind C-s
bind C-s copy-mode

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

set -g base-index 1

setw -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

unbind p
bind-key p paste-buffer

# Theme
set -g @powerkit_separator_style "normal"
set -g @powerkit_edge_separator_style "normal"
set -g @powerkit_status_position "bottom"
set -g @powerkit_theme "tokyo-night"
set -g @powerkit_theme_variant "night"
set -g @powerkit_plugins "datetime,battery,git"

run '~/.tmux/plugins/tpm/tpm'

# Setup for 2 Tmux Environments
bind-key '!' if-shell "tmux has-session -t dev 2>/dev/null" \
  "switch-client -t dev" \
  "new-session -s dev"

bind-key '@' if-shell "tmux has-session -t run 2>/dev/null" \
  "switch-client -t run" \
  "new-session -s run"

